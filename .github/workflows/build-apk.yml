name: Analisar Shinigami APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  analisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair XAPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projeto resultado
          unzip -o HyperDroid-AD-Removal-GitHub.zip -d projeto
          XAPK=$(find projeto -type f -name '*.xapk' -print -quit)
          test -n "$XAPK"
          unzip -o "$XAPK" -d resultado

      - name: Analisar APK principal
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y aapt

          APK="resultado/com.binary.hyperdroid.apk"
          test -f "$APK"

          mkdir -p relatorio

          {
            echo "=== Informações do APK ==="
            aapt dump badging "$APK"
            echo
            echo "=== Arquivos do pacote ==="
            unzip -l "$APK"
          } > relatorio/analise.txt

          cat relatorio/analise.txt

      - name: Disponibilizar relatório
        uses: actions/upload-artifact@v4
        with:
          name: Relatorio-Shinigami
          path: relatorio/analise.txt
          if-no-files-found: error
          retention-days: 7
