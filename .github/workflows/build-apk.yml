name: Inspecionar Shinigami XAPK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  inspect:
    name: Inspecionar pacote Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair arquivo do projeto
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p projeto
          unzip -o HyperDroid-AD-Removal-GitHub.zip -d projeto

          XAPK=$(find projeto -type f -name '*.xapk' -print -quit)

          if [ -z "$XAPK" ]; then
            echo "ERRO: nenhum arquivo XAPK encontrado."
            find projeto -maxdepth 4 -type f
            exit 1
          fi

          mkdir -p resultado
          unzip -o "$XAPK" -d resultado

          echo "Arquivos encontrados dentro do XAPK:"
          find resultado -type f -printf '%p (%s bytes)\n'

      - name: Disponibilizar arquivos extraídos
        uses: actions/upload-artifact@v4
        with:
          name: Analise-Shinigami-XAPK
          path: resultado/
          if-no-files-found: error
          retention-days: 7
