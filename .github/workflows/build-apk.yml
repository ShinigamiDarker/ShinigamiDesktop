
name: Build HyperDroid sem anúncios recomendados

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Verify project files
        run: |
          test -f input.xapk
          test -f scripts/hide_recommended.py

      - name: Install Apktool
        run: |
          curl -fsSL \
            https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.11.1.jar \
            -o apktool.jar

          printf '#!/bin/sh\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' \
            > apktool
          chmod +x apktool
          sudo mv apktool /usr/local/bin/apktool
          sudo mv apktool.jar /usr/local/bin/apktool.jar

      - name: Extract original APK
        run: |
          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile("input.xapk") as archive:
              name = "com.binary.hyperdroid.apk"

              if name not in archive.namelist():
                  raise SystemExit("APK principal não encontrado no XAPK")

              with open("original.apk", "wb") as output:
                  output.write(archive.read(name))
          PY

      - name: Decode APK
        run: apktool d -f original.apk -o decoded

      - name: Apply ad removal patch
        run: |
          python3 scripts/hide_recommended.py \
            decoded/res/layout/start_menu_recommended.xml

      - name: Rebuild APK
        run: apktool b decoded -o unsigned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -keystore test-key.jks \
            -storepass android \
            -keypass android \
            -alias hyperdroid-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=HyperDroid"

      - name: Align and sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f 4 \
            unsigned.apk aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks test-key.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out HyperDroid-no-recommendations.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose \
            HyperDroid-no-recommendations.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperDroid-no-recommendations
          path: HyperDroid-no-recommendations.apk
          if-no-files-found: error
          retention-days: 14
          
