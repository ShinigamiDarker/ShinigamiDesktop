name: Build Shinigami APK
on:
workflow_dispatch:
push:
branches:
- main
- master
permissions:
contents: read
jobs:
build:
name: Compilar aplicativo Android
runs-on: ubuntu-latest
timeout-minutes: 45
steps:
  - name: Baixar repositório
    uses: actions/checkout@v4

  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extrair projeto Android
    run: |
      unzip -o HyperDroid-AD-Removal-GitHub.zip -d projeto

  - name: Localizar Gradle Wrapper
    id: gradle
    shell: bash
    run: |
      GRADLEW=$(find projeto -type f -name gradlew -print -quit)

      if [ -z "$GRADLEW" ]; then
        echo "ERRO: não encontrei o arquivo gradlew dentro do ZIP."
        echo "Arquivos encontrados:"
        find projeto -maxdepth 4 -type f | head -100
        exit 1
      fi

      PROJECT_DIR=$(dirname "$GRADLEW")
      echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      chmod +x "$GRADLEW"

      echo "Projeto Gradle encontrado em: $PROJECT_DIR"

  - name: Configurar Android SDK
    uses: android-actions/setup-android@v3

  - name: Compilar APK
    working-directory: projeto
    run: |
      cd "${{ steps.gradle.outputs.dir }}"
      ./gradlew --no-daemon --stacktrace assembleDebug

  - name: Disponibilizar APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Shinigami-APK
      path: projeto/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error

